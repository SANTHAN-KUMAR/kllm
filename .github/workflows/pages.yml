name: pages

# Publishes site/ (self-contained: HTML, fonts, images) to GitHub Pages. With a custom domain, put it in site/CNAME.
# One-time setup once the repository is public: Settings -> Pages -> Source: GitHub Actions, then run this
# workflow from the Actions tab. After that it runs on every release.
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
