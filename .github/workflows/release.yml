name: release

# Push a tag like v0.3.0 to publish that version to PyPI (then: pipx install kllm-gateway / uv tool install kllm-gateway).
# Uses PyPI trusted publishing: no API token is stored in this repository. One-time setup on pypi.org:
#   Account -> Publishing -> Add a pending publisher: project "kllm-gateway", owner "SANTHAN-KUMAR",
#   repository "kllm", workflow "release.yml", environment "pypi".
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != version v$v in pyproject.toml"; exit 1; }
      - name: Test
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
