name: Bug report
description: Something does not work as the docs say
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you ran, what you expected, what you got instead.
      placeholder: "I ran `kllm up` and ..."
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `kllm doctor`
      description: Remove tokens, keys and tunnel URLs before pasting.
      render: text
  - type: input
    id: version
    attributes:
      label: kllm version
      placeholder: "pip show kllm-gateway"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows]
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Tool you connected (if any)
      placeholder: "Claude Code, opencode, Cursor, my own script ..."
