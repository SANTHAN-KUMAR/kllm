<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-labelledby="t d">
  <title id="t">kllm quick start</title>
  <desc id="d">pipx install kllm-gateway installs the kllm and claude-kllm commands. Running kllm finds the Kaggle token in ~/.kaggle/kaggle.json, writes the config and opens the panel at http://127.0.0.1:8080/admin. claude-kllm then starts Claude Code on the model.</desc>
  <style>
    .bg { fill: #0d0d0f; }
    .bar { fill: #17171a; }
    text { font: 15px ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace; fill: #d6d6d8; white-space: pre; }
    .p { fill: #8cc8ff; }
    .dim { fill: rgba(214,214,216,.55); }
    .ok { fill: #5ee0a0; }
    .c { fill: rgba(214,214,216,.40); }
  </style>
  <rect width="880" height="360" rx="14" class="bg"/>
  <rect width="880" height="38" rx="14" class="bar"/>
  <rect y="24" width="880" height="14" class="bar"/>
  <circle cx="24" cy="19" r="6" fill="#ff5f57"/><circle cx="44" cy="19" r="6" fill="#febc2e"/><circle cx="64" cy="19" r="6" fill="#28c840"/>
  <text x="440" y="24" text-anchor="middle" class="dim" style="font-size:13px">your terminal</text>

  <!-- lines appear one after another (keyframe percentages below), then the loop restarts every 16 s -->
  <g>
    <text x="24" y="74"><tspan class="p">$ </tspan><tspan>pipx install kllm-gateway</tspan></text>
    <text x="24" y="100" class="dim l1">  installed package kllm-gateway 0.3.0</text>
    <text x="24" y="124" class="dim l2">  These apps are now globally available:  kllm  claude-kllm</text>
    <text x="24" y="162" class="l3"><tspan class="p">$ </tspan><tspan>kllm</tspan></text>
    <text x="24" y="188" class="dim l4">kllm: first run: using Kaggle account you (~/.kaggle/kaggle.json)</text>
    <text x="24" y="212" class="dim l5">kllm: wrote ~/.config/kllm/config.yaml</text>
    <text x="24" y="236" class="l6"><tspan class="ok">kllm panel: </tspan><tspan>http://127.0.0.1:8080/admin</tspan></text>
    <text x="24" y="274" class="l7"><tspan class="p">$ </tspan><tspan>claude-kllm</tspan><tspan class="c">      # Claude Code, now on a 35B model in Kaggle</tspan></text>
    <rect x="24" y="290" width="9" height="18" fill="#d6d6d8" class="l8"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
  </g>
  <style>
    .l1 { animation: a1 16s steps(1) infinite; } @keyframes a1 { 0%,9% { opacity: 0; } 10%,100% { opacity: 1; } }
    .l2 { animation: a2 16s steps(1) infinite; } @keyframes a2 { 0%,14% { opacity: 0; } 15%,100% { opacity: 1; } }
    .l3 { animation: a3 16s steps(1) infinite; } @keyframes a3 { 0%,24% { opacity: 0; } 25%,100% { opacity: 1; } }
    .l4 { animation: a4 16s steps(1) infinite; } @keyframes a4 { 0%,34% { opacity: 0; } 35%,100% { opacity: 1; } }
    .l5 { animation: a5 16s steps(1) infinite; } @keyframes a5 { 0%,40% { opacity: 0; } 41%,100% { opacity: 1; } }
    .l6 { animation: a6 16s steps(1) infinite; } @keyframes a6 { 0%,48% { opacity: 0; } 49%,100% { opacity: 1; } }
    .l7 { animation: a7 16s steps(1) infinite; } @keyframes a7 { 0%,60% { opacity: 0; } 61%,100% { opacity: 1; } }
    .l8 { animation: a8 16s steps(1) infinite; } @keyframes a8 { 0%,66% { opacity: 0; } 67%,100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .l1, .l2, .l3, .l4, .l5, .l6, .l7, .l8 { animation: none; opacity: 1; } }
  </style>
</svg>
