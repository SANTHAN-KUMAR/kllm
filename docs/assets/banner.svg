<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d">
  <title id="t">kllm</title>
  <desc id="d">Your coding tools on your PC talk to a local relay; the relay forwards to a model running on two Tesla T4 GPUs in a Kaggle notebook.</desc>
  <defs>
    <radialGradient id="glow" cx="30%" cy="0%" r="90%">
      <stop offset="0" stop-color="#1d2433"/>
      <stop offset="1" stop-color="#0a0a0b"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a1d"/>
      <stop offset="1" stop-color="#0f0f11"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8cc8ff" stop-opacity=".15"/>
      <stop offset=".5" stop-color="#8cc8ff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#8cc8ff" stop-opacity=".15"/>
    </linearGradient>
    <style>
      .h { font: 700 64px "Inter Tight", "Segoe UI", system-ui, sans-serif; fill: #ededee; letter-spacing: -2px; }
      .s { font: 400 22px "Segoe UI", system-ui, sans-serif; fill: rgba(237,237,238,.62); }
      .l { font: 600 15px "Segoe UI", system-ui, sans-serif; fill: #ededee; }
      .m { font: 400 13px ui-monospace, "Cascadia Code", Menlo, monospace; fill: rgba(237,237,238,.55); }
      .k { font: 600 12px ui-monospace, "Cascadia Code", Menlo, monospace; letter-spacing: 1.5px; fill: rgba(237,237,238,.45); }
      .pulse { animation: p 2.4s linear infinite; }
      @keyframes p { from { stroke-dashoffset: 40; } to { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
    </style>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1279" height="399" rx="24" fill="none" stroke="rgba(255,255,255,.08)"/>

  <text x="64" y="118" class="h">kllm</text>
  <text x="64" y="160" class="s">Open-weight LLMs on free Kaggle GPUs,</text>
  <text x="64" y="190" class="s">served as a local API for your coding agents.</text>

  <!-- your PC -->
  <g transform="translate(64 236)">
    <rect width="300" height="120" rx="16" fill="url(#card)" stroke="rgba(255,255,255,.10)"/>
    <text x="20" y="30" class="k">YOUR PC</text>
    <text x="20" y="60" class="l">Claude Code · opencode · Cursor</text>
    <text x="20" y="84" class="m">any OpenAI or Anthropic client</text>
    <text x="20" y="104" class="m">no GPU needed</text>
  </g>

  <!-- relay -->
  <g transform="translate(486 236)">
    <rect width="260" height="120" rx="16" fill="url(#card)" stroke="rgba(140,200,255,.45)"/>
    <text x="20" y="30" class="k">KLLM RELAY</text>
    <text x="20" y="60" class="l">127.0.0.1:8080</text>
    <text x="20" y="84" class="m">one process, ~55 MB</text>
    <text x="20" y="104" class="m">picks, starts, rotates GPUs</text>
  </g>

  <!-- kaggle -->
  <g transform="translate(868 236)">
    <rect width="348" height="120" rx="16" fill="url(#card)" stroke="rgba(185,170,255,.45)"/>
    <text x="20" y="30" class="k">KAGGLE NOTEBOOK</text>
    <g transform="translate(20 46)">
      <rect width="146" height="56" rx="10" fill="rgba(94,224,160,.08)" stroke="rgba(94,224,160,.5)"/>
      <text x="14" y="24" class="l">Tesla T4</text>
      <text x="14" y="44" class="m">16 GB</text>
      <rect x="162" width="146" height="56" rx="10" fill="rgba(94,224,160,.08)" stroke="rgba(94,224,160,.5)"/>
      <text x="176" y="24" class="l">Tesla T4</text>
      <text x="176" y="44" class="m">16 GB</text>
    </g>
  </g>

  <!-- wires -->
  <path d="M368 296 H482" stroke="url(#wire)" stroke-width="2.5" fill="none" stroke-dasharray="6 4" class="pulse"/>
  <path d="M750 296 H864" stroke="url(#wire)" stroke-width="2.5" fill="none" stroke-dasharray="6 4" class="pulse"/>
  <text x="768" y="284" class="m">tunnel</text>
</svg>
