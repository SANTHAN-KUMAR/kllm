<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" role="img" aria-labelledby="t d">
  <title id="t">kllm</title>
  <desc id="d">kllm: free GPUs for your coding agent. Install with pipx install kllm-gateway. OpenAI and Anthropic API on localhost.</desc>
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#151515" stroke-width="1"/>
    </pattern>
    <radialGradient id="fade" cx="32%" cy="45%" r="75%">
      <stop offset="0" stop-color="#0a0a0a" stop-opacity="0"/>
      <stop offset=".75" stop-color="#0a0a0a" stop-opacity="1"/>
    </radialGradient>
    <style>
      .w { font: 600 30px "Geist", "Inter", "Segoe UI", system-ui, -apple-system, sans-serif; fill: #ededed; letter-spacing: -.5px; }
      .h { font: 600 78px "Geist", "Inter", "Segoe UI", system-ui, -apple-system, sans-serif; fill: #ededed; letter-spacing: -3.6px; }
      .c { font: 500 22px "Geist Mono", ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace; fill: #ededed; }
      .p { fill: #5c5c5c; }
      .m { font: 500 18px "Geist Mono", ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace; fill: #8f8f8f; }
    </style>
  </defs>
  <rect width="1280" height="380" rx="20" fill="#0a0a0a"/>
  <rect width="1280" height="380" rx="20" fill="url(#grid)"/>
  <rect width="1280" height="380" rx="20" fill="url(#fade)"/>
  <rect x=".5" y=".5" width="1279" height="379" rx="20" fill="none" stroke="#1f1f1f"/>

  <g transform="translate(72 58)">
    <rect x="0" y="2" width="9" height="30" rx="4.5" fill="#ededed"/>
    <rect x="15.5" y="4" width="16" height="26" rx="6" fill="none" stroke="#8cc8ff" stroke-width="4.5"/>
    <text x="46" y="28" class="w">kllm</text>
  </g>

  <text x="68" y="188" class="h">Free GPUs for your coding agent.</text>

  <g transform="translate(72 248)">
    <rect width="404" height="58" rx="10" fill="#111111" stroke="#2e2e2e"/>
    <text x="22" y="37" class="c"><tspan class="p">$ </tspan>pipx install kllm-gateway</text>
  </g>
  <text x="1208" y="272" class="m" text-anchor="end">OpenAI and Anthropic API on localhost</text>
  <text x="1208" y="300" class="m" text-anchor="end">Claude Code · opencode · any OpenAI client</text>
</svg>
