[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kllm-gateway"          # PyPI name ("kllm" is taken by a look-alike); the commands are kllm and claude-kllm
version = "0.3.2"
description = "Free GPU LLMs for Claude Code, opencode and any OpenAI client: Qwen on Kaggle's free T4s as a local OpenAI/Anthropic API"
readme = "docs/PYPI.md"          # PyPI page: absolute image URLs, no Mermaid (README.md is the GitHub page)
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "SANTHAN-KUMAR" }]
keywords = ["llm", "kaggle", "free-gpu", "llama.cpp", "llama-cpp", "gguf", "qwen", "openai", "openai-compatible", "anthropic",
            "claude-code", "opencode", "coding-agent", "local-llm", "self-hosted", "inference", "mcp", "abliterated"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Software Development",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Deliberately small: LiteLLM is NOT required (relay speaks OpenAI + Anthropic itself).
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "kaggle>=1.6",
]

[project.optional-dependencies]
litellm = ["litellm[proxy]"]     # optional extra: LiteLLM proxy in front of the relay
dev = ["pytest>=8", "pytest-timeout", "anyio", "jsonschema", "jinja2", "numpy", "websockets", "pillow"]

[project.urls]
Homepage = "https://santhan-kumar.github.io/kllm/"
Source = "https://github.com/SANTHAN-KUMAR/kllm"
Documentation = "https://github.com/SANTHAN-KUMAR/kllm#readme"
Changelog = "https://github.com/SANTHAN-KUMAR/kllm/blob/main/CHANGELOG.md"
Issues = "https://github.com/SANTHAN-KUMAR/kllm/issues"
Discussions = "https://github.com/SANTHAN-KUMAR/kllm/discussions"

[project.scripts]
kllm = "gateway.cli:main"
claude-kllm = "gateway.claude_launcher:main"

[tool.hatch.build.targets.wheel]
packages = ["gateway", "swarm"]

# data the wheel needs at runtime (found by gateway.common.data_path)
[tool.hatch.build.targets.wheel.force-include]
"kernel" = "gateway/_data/kernel"
"templates" = "gateway/_data/templates"
"models.yaml" = "gateway/_data/models.yaml"
"config.example.yaml" = "gateway/_data/config.example.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
