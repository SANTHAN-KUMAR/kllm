<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kllm control panel</title>
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='2' y='2' width='5' height='12' rx='2.5' fill='none' stroke='gray' stroke-width='1.4'/%3E%3Crect x='9' y='2' width='5' height='12' rx='2.5' fill='gray'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/admin/ui/css/tokens.css">
<link rel="stylesheet" href="/admin/ui/css/base.css">
<link rel="stylesheet" href="/admin/ui/css/components.css">
<link rel="stylesheet" href="/admin/ui/css/pages.css">
<script>try { var t = JSON.parse(localStorage.getItem("kllm.theme")); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  if (JSON.parse(localStorage.getItem("kllm.side")) === "hidden" || location.pathname === "/chat") document.documentElement.dataset.sidePre = "hidden"; } catch (e) {}</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="k-i-mark" viewBox="0 0 16 16"><rect x="2" y="2" width="5" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="2" width="5" height="12" rx="2.5" fill="currentColor"/></symbol>
    <symbol id="k-i-chip" viewBox="0 0 16 16"><rect x="4" y="4" width="8" height="8" rx="1.5"/><path d="M6 1.5v2.5M10 1.5v2.5M6 12v2.5M10 12v2.5M1.5 6H4M1.5 10H4M12 6h2.5M12 10h2.5"/></symbol>
    <symbol id="k-i-film" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="2"/><path d="M6.5 6v4l3.5-2z"/></symbol>
    <symbol id="k-i-image" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="2"/><circle cx="6" cy="6.5" r="1.2"/><path d="M2.5 12l3.5-3.5 2.5 2.5 2-2 3 3"/></symbol>
    <symbol id="k-i-plus" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></symbol>
    <symbol id="k-i-dots" viewBox="0 0 16 16"><circle cx="3.5" cy="8" r=".9"/><circle cx="8" cy="8" r=".9"/><circle cx="12.5" cy="8" r=".9"/></symbol>
    <symbol id="k-i-arrow" viewBox="0 0 16 16"><path d="M3 8h10M9 4l4 4-4 4"/></symbol>
    <symbol id="k-i-check" viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7"/></symbol>
    <symbol id="k-i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></symbol>
    <symbol id="k-i-down" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></symbol>
    <symbol id="k-i-x" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></symbol>
    <symbol id="k-i-term" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="2"/><path d="M5 7l2 1.5L5 10M8.5 10.5h3"/></symbol>
    <symbol id="k-i-rotate" viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.5M13 2.5v3h-3"/></symbol>
    <symbol id="k-i-page" viewBox="0 0 16 16"><path d="M4 2h5.5L12 4.5V14H4z"/><path d="M6 7.5h4M6 10h4"/></symbol>
    <symbol id="k-i-panel" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="2"/><path d="M6 3v10"/></symbol>
    <symbol id="k-i-max" viewBox="0 0 16 16"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></symbol>
    <symbol id="k-i-info" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 7.2v4M8 4.8v.1"/></symbol>
    <symbol id="k-i-stop" viewBox="0 0 16 16"><rect x="4" y="4" width="8" height="8" rx="1.5"/></symbol>
    <symbol id="k-i-pause" viewBox="0 0 16 16"><path d="M6 4v8M10 4v8"/></symbol>
    <symbol id="k-i-play" viewBox="0 0 16 16"><path d="M5 3.5v9l7-4.5z"/></symbol>
    <symbol id="k-i-copy" viewBox="0 0 16 16"><rect x="5" y="5" width="8" height="8" rx="1.5"/><path d="M3 10.5V4a1 1 0 0 1 1-1h6.5"/></symbol>
    <symbol id="k-i-key" viewBox="0 0 16 16"><circle cx="5.5" cy="10.5" r="3"/><path d="M7.7 8.3L13.5 2.5M11 5l2 2"/></symbol>
    <symbol id="k-i-link" viewBox="0 0 16 16"><path d="M7 9a3 3 0 0 0 4.2 0l2-2a3 3 0 0 0-4.2-4.2l-.7.7M9 7a3 3 0 0 0-4.2 0l-2 2a3 3 0 0 0 4.2 4.2l.7-.7"/></symbol>
    <symbol id="k-i-branch" viewBox="0 0 16 16"><circle cx="4.5" cy="3.5" r="1.5"/><circle cx="4.5" cy="12.5" r="1.5"/><circle cx="11.5" cy="5.5" r="1.5"/><path d="M4.5 5v6M11.5 7a4 4 0 0 1-4 4h-3"/></symbol>
    <symbol id="k-i-clock" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.5 1.5"/></symbol>
    <symbol id="k-i-trash" viewBox="0 0 16 16"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.7 9h5.6l.7-9"/></symbol>
    <symbol id="k-i-user" viewBox="0 0 16 16"><circle cx="8" cy="5.5" r="2.7"/><path d="M3 13.5a5 5 0 0 1 10 0"/></symbol>
    <symbol id="k-i-shield" viewBox="0 0 16 16"><path d="M8 2l5 2v4c0 3-2.2 5.2-5 6-2.8-.8-5-3-5-6V4z"/></symbol>
    <symbol id="k-i-layers" viewBox="0 0 16 16"><path d="M8 2.5l6 3-6 3-6-3zM2 8.5l6 3 6-3M2 11.5l6 3 6-3"/></symbol>
    <symbol id="k-i-send" viewBox="0 0 16 16"><path d="M8 13V3M4 7l4-4 4 4"/></symbol>
    <symbol id="k-i-minus" viewBox="0 0 16 16"><path d="M3.5 8h9"/></symbol>
    <symbol id="k-i-sliders" viewBox="0 0 16 16"><path d="M2.5 4.5h6M11.5 4.5h2M2.5 11.5h2M7.5 11.5h6"/><circle cx="10" cy="4.5" r="1.5"/><circle cx="6" cy="11.5" r="1.5"/></symbol>
    <symbol id="k-i-edit" viewBox="0 0 16 16"><path d="M10.5 2.5l3 3-8 8H2.5v-3z"/><path d="M9 4l3 3"/></symbol>
    <symbol id="k-i-arrowdown" viewBox="0 0 16 16"><path d="M8 3v10M4 9l4 4 4-4"/></symbol>
    <symbol id="k-i-compose" viewBox="0 0 16 16"><path d="M13 9v3.5a1 1 0 0 1-1 1H3.5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1H7"/><path d="M11.5 2l2.5 2.5L9 9.5H6.5V7z"/></symbol>
    <symbol id="k-i-bolt" viewBox="0 0 16 16"><path d="M9 1.5L3.5 9H8l-1 5.5L12.5 7H8z"/></symbol>
  </defs>
</svg>
<div class="k-app" id="k-app">
  <nav class="k-side" id="k-side" aria-label="Main"></nav>
  <main class="k-main" id="k-main">
    <div class="k-global-banner" id="k-relay-down" role="alert" hidden></div>
    <div id="k-view"></div>
  </main>
</div>
<button class="k-btn k-sm k-float-open" id="k-float-open" aria-label="Show sidebar" title="Show sidebar (Ctrl \)"><svg class="k-ic" aria-hidden="true"><use href="#k-i-panel"/></svg></button>
<noscript><p style="padding:40px">The kllm panel needs JavaScript.</p></noscript>
<script type="module" src="/admin/ui/js/app.js"></script>
</body>
</html>
