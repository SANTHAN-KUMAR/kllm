    desc: "Qwen3.8-27B in IQ3_XXS 3-bit quant (unsloth imatrix) — 256K context with q8_0 KV. ~3.3 bpw; trades ~1-2 quality points for ~6GB weight headroom vs Q4_K_M. Use when 256K f16 KV does not fit."
