# kllm model registry — abliterated (uncensored) models for 2x Tesla T4 (30 GB VRAM).
# Pick with `kllm model <key>` (default) or `kllm up --model <key>`, or launch from the panel.
#
#   hf / file   HuggingFace GGUF repo + exact file (preferred: imatrix "i1" quants are more accurate
#               per bit). `quant` alone also works (llama-server -hf repo:quant).
#   template    optional patched chat template (templates/), shipped into the kernel
#   ctx         context the server allocates. Clients read it: claude-kllm live, opencode via its config.
#   args        per-model llama-server flags, appended after the kernel defaults (so they win).
#
# What was measured on 2xT4 (2026-10-06), and why the flags look like this:
#   * KV cache f16, not q8_0: on Turing, quantized KV takes llama.cpp's slow FlashAttention VEC path
#     -> generation 1.6-2.5x slower at 12-43K context. Use q8_0 only when f16 does not fit.
#   * -sm tensor (split each layer across both GPUs instead of pipelining them): +13-54% generation,
#     prefill unchanged. Needs flash-attn + unquantized KV.
#   * --spec-type ngram-mod: lossless speculation from text already in the context; agents copy a
#     lot (Edit old_string, file rewrites) -> 120-300 t/s on copied spans.
#   * no repeat/DRY penalties: they penalise copying prompt text and corrupt Edit old_string.
#     Loops are handled by the relay's generic loop guard instead.
#   * MTP speculation: the abliterated Qwen3.6 GGUF has no MTP layers (verified) -> not usable.
# Any model, not only llama.cpp text models (`kllm add <hf repo or URL>` writes these entries for you):
#   runtime     llama.cpp (default when absent) | diffusers (image/video pipelines, fp16, served in the kernel)
#   kind        chat (default) | image | video       (diffusers defaults to image)
#   opts        diffusers only: size, steps, guidance_scale, num_frames, fps, negative_prompt, variant,
#               offload (auto|gpu|model|sequential|balanced), vae_tiling, fp32: [components], pip: [extra packages],
#               warmup, size_multiple, max_frames, max_n. Request fields override them per call.
#   Image/video backends run one request at a time; call them on the relay at
#   /v1/images/generations and /v1/videos/generations (see README "Any model: chat, image, video").
#
# Models marked "unverified" have correct files (checked on HF) but were not benchmarked on kllm.

models:
  qwen3.8-27b:                              # Official clean raw Qwen3.8-27B dense foundation model (thinking)
    hf: sigmanih/Qwen-Qwen3.8-27B-GGUF-Q4_K_M
    quant: Q4_K_M
    file: Qwen--Qwen3.8-27B.Q4_K_M.gguf
    template: templates/qwen3.6.jinja
    vram_gb: 27
    ctx: 131072                             # 128K context floor (100% in VRAM, f16 KV, uncorrupted weights)
    args: ["--temp", "0.6", "--top-p", "0.95", "--top-k", "20", "--min-p", "0",
           "--reasoning-format", "deepseek", "--reasoning-budget", "8192", "--reasoning-budget-message", "\n\nOkay, I have thought about this enough. Now I will give my final answer based on the reasoning above.\n",
           "-b", "2048", "-ub", "1024", "--cache-type-k", "f16", "--cache-type-v", "f16",
           "-ctxcp", "16", "-cms", "12288",
           "-sm", "tensor", "--spec-type", "draft-mtp,ngram-mod", "--spec-draft-n-max", "3", "-np", "2",
           "--cache-ram", "6144"]
    desc: "Official clean raw Qwen3.8-27B dense foundation model (clean Q4_K_M quant) — full uncorrupted weights, high-IQ reasoning and coding, 128K context."
    tags: [thinking, long-context, verified, clean]

